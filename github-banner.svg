<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="GitHub profile banner" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D1424"/>
      <stop offset="1" stop-color="#16213A"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0D1424" stop-opacity="1"/>
      <stop offset="0.45" stop-color="#0D1424" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#0D1424" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="main" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4C8DFF" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#4C8DFF"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#8FA3CC" opacity="0.14"/>
    </pattern>
    <filter id="glow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    .line { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1.6s ease-out forwards; }
    .l1 { animation-delay: .2s; }
    .l2 { animation-delay: .9s; }
    .l3 { animation-delay: 1.3s; }
    .node { opacity: 0; animation: pop .5s ease-out forwards; }
    .txt { opacity: 0; animation: rise .9s ease-out forwards; }
    .head { fill: none; stroke: #E8EEF9; stroke-width: 2; transform-box: fill-box; transform-origin: center; animation: ring 2.8s ease-out 2.2s infinite; opacity: 0; }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes pop { from { opacity: 0; } to { opacity: 1; } }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes ring { 0% { opacity: .55; transform: scale(.6); } 100% { opacity: 0; transform: scale(2.2); } }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .line, .node, .txt { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .head, .cursor { animation: none; }
    }
  </style>

  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#dots)"/>

  <!-- commit graph -->
  <g fill="none" stroke-width="3" stroke-linecap="round">
    <path class="line l1" pathLength="1" d="M560 160 H1280" stroke="url(#main)"/>
    <path class="line l2" pathLength="1" d="M700 160 C740 160 740 90 790 90 H950 C990 90 990 160 1030 160" stroke="#5EEAD4" stroke-opacity="0.85"/>
    <path class="line l3" pathLength="1" d="M840 160 C880 160 880 232 930 232 H1120 C1160 232 1160 160 1200 160" stroke="#8B7CFF" stroke-opacity="0.85"/>
  </g>

  <g>
    <circle class="node" style="animation-delay:.5s" cx="640" cy="160" r="7" fill="#0D1424" stroke="#4C8DFF" stroke-width="3"/>
    <circle class="node" style="animation-delay:.7s" cx="700" cy="160" r="7" fill="#4C8DFF"/>
    <circle class="node" style="animation-delay:1.0s" cx="790" cy="90" r="7" fill="#0D1424" stroke="#5EEAD4" stroke-width="3"/>
    <circle class="node" style="animation-delay:1.2s" cx="870" cy="90" r="7" fill="#5EEAD4"/>
    <circle class="node" style="animation-delay:1.4s" cx="950" cy="90" r="7" fill="#0D1424" stroke="#5EEAD4" stroke-width="3"/>
    <circle class="node" style="animation-delay:.9s" cx="840" cy="160" r="7" fill="#4C8DFF"/>
    <circle class="node" style="animation-delay:1.5s" cx="930" cy="232" r="7" fill="#0D1424" stroke="#8B7CFF" stroke-width="3"/>
    <circle class="node" style="animation-delay:1.7s" cx="1030" cy="232" r="7" fill="#8B7CFF"/>
    <circle class="node" style="animation-delay:1.9s" cx="1120" cy="232" r="7" fill="#0D1424" stroke="#8B7CFF" stroke-width="3"/>
    <circle class="node" style="animation-delay:1.6s" cx="1030" cy="160" r="7" fill="#4C8DFF"/>
    <circle class="node" style="animation-delay:2.1s" cx="1200" cy="160" r="9" fill="#E8EEF9"/>
    <circle class="head" cx="1200" cy="160" r="16"/>
  </g>

  <!-- travelling commits -->
  <g filter="url(#glow)">
    <circle r="4.5" fill="#4C8DFF" opacity="0">
      <animateMotion dur="5s" begin="2.4s" repeatCount="indefinite" path="M560 160 H1200"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="5s" begin="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle r="4" fill="#5EEAD4" opacity="0">
      <animateMotion dur="4s" begin="3.2s" repeatCount="indefinite" path="M700 160 C740 160 740 90 790 90 H950 C990 90 990 160 1030 160"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="4s" begin="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle r="4" fill="#8B7CFF" opacity="0">
      <animateMotion dur="4.5s" begin="4s" repeatCount="indefinite" path="M840 160 C880 160 880 232 930 232 H1120 C1160 232 1160 160 1200 160"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="4.5s" begin="4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- left fade so text stays readable -->
  <rect width="760" height="320" fill="url(#fade)"/>

  <!-- text -->
  <g font-family="'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif">
    <text class="txt" style="animation-delay:.1s" x="72" y="140" font-size="64" font-weight="800" fill="#E8EEF9" letter-spacing="-1.5">Your Name</text>
    <text class="txt" style="animation-delay:.35s" x="74" y="188" font-size="26" font-weight="500" fill="#9DB4E6">Full-stack developer building fast, reliable web products</text>
    <rect class="txt" style="animation-delay:.55s" x="74" y="216" width="56" height="4" rx="2" fill="#4C8DFF"/>
    <text class="txt" style="animation-delay:.75s" x="74" y="256" font-family="'SFMono-Regular','Menlo','Consolas',monospace" font-size="19" fill="#7F93BD">TypeScript   Python   Go   React   PostgreSQL   AWS<tspan class="cursor" fill="#5EEAD4" dx="8">|</tspan></text>
  </g>
</svg>
